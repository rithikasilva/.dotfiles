set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g status-position top
set -gq allow-passthrough on
set -g extended-keys on
set -g extended-keys-format csi-u


# Change bar background when zoomed
unbind z
bind z resize-pane -Z \;\
    if -F '#{window_zoomed_flag}' \
        'set -g status-style bg=colour225,fg=black' \
        'set -g status-style bg=default,fg=default'


bind r source-file ~/.tmux.conf \; display "Config reloaded!"
bind -n C-f display-popup -E -w 80% -h 30% "tmux-sessionizer"

# C-g belongs to kitty (tmux -> herdr switch, see kitty.conf), not tmux.
# Explicitly unbind since a prior config once bound it here and
# `source-file` doesn't clear bindings that are just absent from the file.
unbind -n C-g

unbind q
bind-key q kill-session


set-option -g status-left-length 50
set-option -g status-right-length 50
set -g prefix C-s

# act like vim
setw -g mode-keys vi
set -g status-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind -T copy-mode-vi v send -X begin-selection

# Change pane keybinds and current dir
unbind -
bind-key - split-window -v -c "#{pane_current_path}"
unbind \\ 
bind-key \\ split-window -h -c "#{pane_current_path}"

set -g status-style bg=default
set-option -g pane-active-border-style fg=white
set-option -g pane-border-style fg=white
set -g status-fg colour250

# Codex/ChatGPT and Claude Code rate-limit usage (5h/weekly, whichever
# windows the account has) in the status bar. Cached by each script itself;
# status-interval just controls how often tmux re-invokes them.
#
# Gated behind @usage-bar-enabled (default: on) so machines that don't use
# these tools (e.g. a work laptop on a different agent setup) can turn the
# bar off without editing this tracked file. Override locally in
# ~/.tmux.conf.local (gitignored; sourced before the flag is read, so it
# can override the default in time to take effect on this same reload):
#   set -g @usage-bar-enabled off
set -g @usage-bar-enabled on
source-file -q ~/.tmux.conf.local

if -F '#{@usage-bar-enabled}' \
    'set -g status-interval 60; set -g status-right "#[fg=colour35,bold]Codex #[fg=colour250,nobold]#(~/.dotfiles/scripts/dev-env/codex-status statusline 2>/dev/null) #[fg=colour208,bold]Claude #[fg=colour250,nobold]#(~/.dotfiles/scripts/dev-env/claude-status statusline 2>/dev/null) | %H:%M"' \
    'set -g status-right "%H:%M"'

set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'tmux-plugins/tpm'
run "~/.tmux/plugins/tpm/tpm"

