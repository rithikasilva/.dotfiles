include vague.conf

# font_family Iosevka Nerd Font
font_family JetBrainsMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto

# Nerd Font Symbols
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d4,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b1,U+e700-U+e7c5,U+f000-U+f2e0,U+f300-U+f372,U+f400-U+f532,U+f0001-U+f1af0 Symbols Nerd Font Mono

confirm_os_window_close 0

font_size 14.0

shell_integration no-cursor
cursor_trail 3
cursor_shape block
cursor_blink_interval 0

disable_ligatures never
text_composition_strategy legacy
# hide_window_decorations yes

# Disable cmd+- binding to avoid conflict with Neovim horizontal split
map cmd+- no_op

# Switch to the herdr tab, creating it on first use rather than at
# startup. Pressing it again from inside the herdr tab goes back to
# whichever tab was active before. See herdr_toggle.py.
map ctrl+g kitten herdr_toggle.py

